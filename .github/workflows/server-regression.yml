name: WFTNP server regression tests

on:
  push:
    branches:
      - fix/server-lifecycle-race
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test tools
        run: python -m pip install -e '.[discovery]' pytest pytest-asyncio
      - name: Server regression tests
        run: python -m pytest -q tests/test_server_transport.py
      - name: Multi-client stress tests
        run: python -m pytest -q tests/test_server_stress.py
      - name: Full test suite
        run: python -m pytest -q
