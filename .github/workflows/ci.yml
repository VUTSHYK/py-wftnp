name: CI
on:
  push:
    branches: [master, feature/server-diagnostics]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-24.04-arm
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - name: Pytest with per-test progress and hang diagnostics
        env:
          PYTHONUNBUFFERED: '1'
          PYTEST_ADDOPTS: '-vv -s --durations=20'
        run: |
          uv run python -m pytest --cov=wftnp --cov-report=term-missing -o faulthandler_timeout=90
        timeout-minutes: 12
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv run --isolated --no-project --with dist/wftnp-*.whl python -c "from wftnp import WftnpClient, Endpoint; print(WftnpClient(Endpoint('localhost')).state)"
